# fly.toml file for monitoring-jaringan-small-tide-9423

app = "monitoring-jaringan-small-tide-9423"
primary_region = "nrt"

[build]
  [build.args]
    PHP_VERSION = "8.1"
    NODE_VERSION = "18"

[deploy]
  release_command = "php artisan migrate --force"

[env]
  APP_ENV = "production"
  APP_DEBUG = "false"
  LOG_CHANNEL = "stderr"
  SESSION_DRIVER = "database"
  CACHE_DRIVER = "file"
  DB_CONNECTION = "mysql"
  DB_PORT = "4000"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = true
  min_machines_running = 0
  processes = ["app"]

[http_service.concurrency]
  type = "connections"
  hard_limit = 25
  soft_limit = 20
